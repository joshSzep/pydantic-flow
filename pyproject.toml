[project]
name = "pydantic-flow"
version = "0.21.0"
description = "An opinionated pydantic-ai based framework with batteries included."
readme = "README.md"
authors = [
    { name = "Szepietowski, Joshua", email = "joshszep@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aioboto3>=14.0.0",
    "aiosqlite>=0.20.0",
    "anyio>=4.11.0",
    "asyncpg>=0.29.0",
    "chevron>=0.14.0",
    "hnswlib>=0.8.0",
    "httpx>=0.28.0",
    "jinja2>=3.1.6",
    "numpy>=2.3.4",
    "openai>=1.60.0",
    "opentelemetry-api>=1.38.0",
    "opentelemetry-exporter-otlp>=1.38.0",
    "opentelemetry-sdk>=1.38.0",
    "pgvector>=0.3.8",
    "pydantic-ai>=1.2.1",
    "redis[hiredis]>=5.0.0",
    "rich>=14.2.0",
    "sentence-transformers>=3.4.0",
    "sqlite-utils>=3.38",
    "typer>=0.20.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "pytest-repeat>=0.9.4",
    "ruff>=0.14.1",
    "ty>=0.0.1a23",
]

[project.urls]
Homepage = "https://github.com/joshSzep/pydantic-flow"
Repository = "https://github.com/joshSzep/pydantic-flow"
Issues = "https://github.com/joshSzep/pydantic-flow/issues"
Documentation = "https://github.com/joshSzep/pydantic-flow#readme"

[tool.uv]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E","F","W","I","UP","NPY","PTH","B","C4","SIM","PL","RUF","D"]
ignore = ["D203","D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004", "PLC0415", "SIM102"]  # Allow magic values, imports in functions, nested ifs in tests
"examples/**/*.py" = ["D401", "PLR2004", "RUF001", "E501"]  # Allow imperative mood, magic numbers, unicode chars, long lines in examples
"src/pydantic_flow/engine/stepper.py" = ["PLR0913"]  # EngineConfig init needs multiple params
"src/pydantic_flow/flow/flow.py" = ["PLR0912", "PLR0915", "PLC0415"]  # Complex flow execution logic, local imports to avoid circular deps
"src/pydantic_flow/nodes/agent.py" = ["PLR0913"]  # AgentNode init needs multiple params
"src/pydantic_flow/nodes/base.py" = ["PLC0415"]  # Local imports for zero-cost telemetry
"src/pydantic_flow/cache/middleware.py" = ["UP040", "PLR0912", "PLC0415"]  # TypeVar needed for proper typing, complex branching, local imports for telemetry helpers
"src/pydantic_flow/telemetry/setup.py" = ["PLR0913", "PLW0603"]  # setup function needs multiple params, singleton pattern requires globals
"src/pydantic_flow/telemetry/helpers.py" = ["PLC0415"]  # Local imports for zero-cost telemetry
"src/pydantic_flow/nodes/flow.py" = ["PLR0912"]  # Complex memory mode handling
"src/pydantic_flow/checkpoints/*.py" = ["PLC0415"]  # Local imports for optional dependencies (asyncpg, aioboto3)
"src/pydantic_flow/rag/embeddings/huggingface.py" = ["PLC0415"]  # Local import for optional sentence-transformers dependency

[tool.ruff.format]
preview = true

[tool.ruff.lint.isort]
combine-as-imports = false
force-single-line = true
force-sort-within-sections = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ty.rules]
# Disable too-many-positional-arguments due to TypeVarTuple (*InputTs) not being understood
too-many-positional-arguments = "ignore"

[tool.pytest.ini_options]
addopts = [
    "--cov=src/pydantic_flow",  # Coverage for pydantic_flow package
    "--cov-report=term-missing",  # Show missing lines in coverage
    "--cov-report=html",  # Generate HTML coverage report
]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "error",  # Turn warnings into errors
]

[tool.coverage.run]
branch = true
source = ["src/pydantic_flow"]

[tool.coverage.report]
fail_under = 87

[build-system]
requires = ["uv_build>=0.9.4,<0.10.0"]
build-backend = "uv_build"
